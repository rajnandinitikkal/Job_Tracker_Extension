<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

  <style>
    body { width: 420px; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; background: #fff; }
    h3 { margin-top: 0; color: #333; }
    .header-box { display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:15px; border: 1px solid #eee; }
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
    input:checked + .slider { background-color: #0078d4; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .job-item { border-bottom: 1px solid #eee; padding: 12px 0; }
    .job-item:last-child { border-bottom: none; }
    .title { font-weight: bold; font-size: 14px; color: #0078d4; text-decoration: none; display: block; margin-bottom: 4px; }
    .title:hover { text-decoration: underline; }
    .url-text { font-size: 10px; color: #777; word-break: break-all; margin-bottom: 8px; }
    .controls { display: flex; gap: 10px; }
    .btn { cursor: pointer; font-size: 16px; padding: 5px 12px; border-radius: 5px; border: 1px solid #ddd; background: #fff; transition: background 0.2s; }
    .btn:hover { background: #f0f0f0; }
    #stats { font-size: 12px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>🚀 Job Tracker</h3>
  
  <div class="header-box">
    <span style="font-size: 13px; font-weight: 500;">Page Overlay Enabled</span>
    <label class="switch">
      <input type="checkbox" id="globalToggle">
      <span class="slider"></span>
    </label>
  </div>
    <div style="margin-bottom: 15px;">
    <button id="downloadCsv" class="btn" style="width: 100%; background: #28a745; color: white; border: none; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        📥 Download CSV Report
    </button>
  </div>

  <div id="stats">Loading...</div>
  <div id="list"></div>



<script src="export.js"></script>
<script src="popup.js"></script>
</body>
</html>
